<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Clothing Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--fg:#22201d;--mu:#7a746c;--card:#fff;--ac:#1f3d36;--bd:#e3ddd3;--ok:#1f7a4d;--no:#b3392f;--wa:#1faa59}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--fg:#efebe4;--mu:#9b948a;--card:#222220;--ac:#8fc5b4;--bd:#34332f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Figtree,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:600 26px Fraunces,Georgia,serif;margin:0}h1 a{color:inherit;text-decoration:none}h2{font:600 20px Fraunces,Georgia,serif;margin:28px 0 10px}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px}a{color:var(--ac)}.mu{color:var(--mu);font-size:14px}
button,input,select,textarea{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{background:var(--ac);color:var(--bg);border:0;cursor:pointer;font-weight:600}button.x{background:none;color:var(--no);border:1px solid var(--no)}button.w{background:var(--wa);color:#fff}button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 14px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;background:var(--card);font-size:14px}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.p img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bd)}.p b{display:block;margin-top:8px}.p button{width:100%;margin-top:8px}
.box,.row,.ord{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ord{display:block}.row img{width:56px;height:56px;object-fit:cover;border-radius:8px}.row>div{flex:1;min-width:120px}.row input{width:90px}
.st{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:600;color:#fff;background:#b8860b}.st.approved{background:var(--ok)}.st.rejected{background:var(--no)}
.t{display:flex;justify-content:space-between;gap:10px}.q button{padding:2px 10px}
button{min-height:44px}textarea{resize:vertical}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.box>input,.box>select,.box>button,.box>textarea{flex:1 1 100%}.row input{width:100%}.row button{flex:1}h1{font-size:21px}header{padding:12px}}
</style></head><body>
<header><h1><a href="#/" id="nm"></a></h1><nav style="display:flex;gap:16px"><a href="#/orders">My orders</a><a href="#/cart" id="ct">Cart</a></nav></header>
<main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ===== EDIT THESE ===== */
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const WA="60123456789";        // seller WhatsApp number, country code, no + or spaces
const SHOP="My Clothing Shop"; // shop name
const CUR="RM";                // currency
/* ====================== */

const db=getFirestore(initializeApp(CFG)),auth=getAuth();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const m=n=>CUR+' '+Number(n).toFixed(2);
let P=[],C=[],O=[],OV=null,user=null,cat='All',cart={},unsubO,unsubV;
try{cart=JSON.parse(localStorage.cart||'{}')}catch{}
const save=()=>{try{localStorage.cart=JSON.stringify(cart)}catch{}};
let MY={},ids=[],info={};try{ids=JSON.parse(localStorage.ords||'[]');info=JSON.parse(localStorage.info||'{}')}catch{}
const keep=()=>{try{localStorage.ords=JSON.stringify(ids);localStorage.info=JSON.stringify(info)}catch{}};
const watch=id=>onSnapshot(doc(db,'orders',id),d=>{if(d.exists())MY[id]={id,...d.data()};render(1)},()=>{});
ids.forEach(watch);
const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
$('#nm').textContent=SHOP;document.title=SHOP;

onSnapshot(collection(db,'products'),s=>{P=list(s);render(1)});
onSnapshot(collection(db,'categories'),s=>{C=list(s).sort((a,b)=>a.name.localeCompare(b.name));render(1)});
onAuthStateChanged(auth,u=>{user=u;unsubO&&unsubO();unsubO=0;O=[];
 if(u)unsubO=onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc')),s=>{O=list(s);render(1)});render()});
addEventListener('hashchange',()=>{unsubV&&unsubV();unsubV=0;OV=null;const h=location.hash;
 if(h.startsWith('#/order/'))unsubV=onSnapshot(doc(db,'orders',h.slice(8)),d=>{OV=d.exists()?{id:d.id,...d.data()}:0;render(1)},()=>{OV=0;render(1)});
 render()});dispatchEvent(new Event('hashchange'));

const cartItems=()=>Object.entries(cart).map(([id,q])=>({p:P.find(x=>x.id==id),q})).filter(x=>x.p&&x.p.qty>0).map(x=>({...x,q:Math.min(x.q,x.p.qty)}));
const total=()=>cartItems().reduce((s,x)=>s+x.p.price*x.q,0);
const waUrl=(o)=>{const link=location.origin+location.pathname+'#/order/'+o.id;
 const t=`Hi, I'd like to pay for my order.\nName: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.address}\n`+o.items.map(i=>`- ${i.name} x${i.qty}`).join('\n')+`\nTotal: ${m(o.total)}\nOrder link: ${link}`;
 return`https://wa.me/${WA}?text=${encodeURIComponent(t)}`};

function render(bg){
 if(bg&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
 $('#ct').textContent='Cart ('+cartItems().reduce((s,x)=>s+x.q,0)+')';
 const h=location.hash.slice(1)||'/';
 app.innerHTML=h=='/admin'?admin():h=='/cart'?cartPage():h=='/orders'?myOrders():h.startsWith('/order/')?orderPage():shop();
}
function shop(){
 const ps=P.filter(p=>cat=='All'||p.cat==cat).sort((a,b)=>b.createdAt-a.createdAt);
 return`<div class=chips>${['All',...C.map(c=>c.name)].map(c=>`<span class="chip ${c==cat?'on':''}" data-a=cat data-id="${esc(c)}">${esc(c)}</span>`).join('')}</div>
 <div class=grid>${ps.map(p=>`<div class=p><img src="${p.img}" alt="${esc(p.name)}"><b>${esc(p.name)}</b><span class=mu>${m(p.price)} · ${p.qty>0?p.qty+' left':'Sold out'}</span><button data-a=add data-id="${p.id}" ${p.qty>0?'':'disabled'}>Add to cart</button></div>`).join('')||'<p class=mu>No products yet.</p>'}</div>`}
function cartPage(){
 const it=cartItems();if(!it.length)return'<h2>Your cart is empty</h2><a href="#/">Browse clothes</a>';
 return`<h2>Your cart</h2>${it.map(x=>`<div class=row><img src="${x.p.img}"><div><b>${esc(x.p.name)}</b><br><span class=mu>${m(x.p.price)}</span></div><span class=q><button data-a=dec data-id="${x.p.id}">−</button> ${x.q} <button data-a=inc data-id="${x.p.id}">+</button></span><button class=x data-a=rm data-id="${x.p.id}">Remove</button></div>`).join('')}
 <div class=box><div class=t style="width:100%"><b>Total</b><b>${m(total())}</b></div><input id=nmi placeholder="Your name" value="${esc(info.name)}" style="flex:1;min-width:140px"><input id=phi type=tel placeholder="Phone number" value="${esc(info.phone)}" style="flex:1;min-width:140px"><textarea id=adi placeholder="Delivery address" rows=3 style="width:100%">${esc(info.address)}</textarea><button class=w data-a=checkout>Checkout and pay on WhatsApp</button></div>
 <p class=mu>Your order is saved first, then WhatsApp opens with your order link. Send the message and pay the seller there.</p>`}
function myOrders(){
 const l=ids.map(i=>MY[i]).filter(Boolean).sort((a,b)=>b.createdAt-a.createdAt);
 return`<h2>My orders</h2>${l.map(o=>`<a href="#/order/${o.id}" style="text-decoration:none;color:inherit"><div class=ord><div class=t><b>${new Date(o.createdAt).toLocaleDateString()} · ${m(o.total)}</b><span class="st ${o.status}">${o.status}</span></div><span class=mu>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</span></div></a>`).join('')||'<p class=mu>No orders on this phone yet.</p>'}<p class=mu>Orders are remembered on this phone and browser. If you clear browser data, use the order link from your WhatsApp chat.</p>`}
const msg={pending:'Waiting for the seller to confirm your payment.',approved:'Payment confirmed. Your order is approved.',rejected:'The seller rejected this order. Please contact them on WhatsApp.'};
function orderPage(){
 if(OV===null)return'<p class=mu>Loading order…</p>';if(!OV)return'<h2>Order not found</h2>';
 return`<h2>Order status</h2><div class=ord><span class="st ${OV.status}">${OV.status}</span> <p>${msg[OV.status]}</p><p class=mu>Deliver to: ${esc(OV.name)}, ${esc(OV.phone)}, ${esc(OV.address)}</p>
 ${OV.items.map(i=>`<div class=t><span>${esc(i.name)} × ${i.qty}</span><span>${m(i.price*i.qty)}</span></div>`).join('')}<hr><div class=t><b>Total</b><b>${m(OV.total)}</b></div>
 ${OV.status=='pending'?`<p><button class=w data-a=wa>Send order on WhatsApp</button></p>`:''}</div><p class=mu>Bookmark this page to check your order later.</p>`}
const ordCard=o=>`<div class=ord><div class=t><b>${esc(o.name)}</b><span class="st ${o.status}">${o.status}</span></div><span class=mu>${new Date(o.createdAt).toLocaleString()}</span><br><span class=mu>${esc(o.phone)} · ${esc(o.address)}</span>
 ${o.items.map(i=>`<div class=t><span>${esc(i.name)} × ${i.qty}</span><span>${m(i.price*i.qty)}</span></div>`).join('')}<div class=t><b>Total</b><b>${m(o.total)}</b></div>
 ${o.status=='pending'?`<p><button data-a=approve data-id="${o.id}">Approve</button> <button class=x data-a=reject data-id="${o.id}">Reject</button></p>`:''}</div>`;
function admin(){
 if(!user)return`<div class=box><h2 style="margin:0;width:100%">Seller login</h2><input id=em placeholder=Email><input id=pw type=password placeholder=Password><button data-a=login>Log in</button></div>`;
 return`<div class=t><h2>Orders (${O.filter(o=>o.status=='pending').length} pending)</h2><button class=x data-a=logout>Log out</button></div>${O.map(ordCard).join('')||'<p class=mu>No orders yet.</p>'}
 <h2>Add product</h2><div class=box><input id=pn placeholder=Name><select id=pc>${C.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><input id=pp type=number min=0 step=.01 placeholder=Price><input id=pq type=number min=0 placeholder=Quantity><input id=pi type=file accept="image/*"><button data-a=addp>Add product</button></div>
 <h2>Categories</h2><div class=box><input id=cn placeholder="New category"><button data-a=addc>Add category</button><div class=chips>${C.map(c=>`<span class=chip>${esc(c.name)} <b data-a=delc data-id="${c.id}">×</b></span>`).join('')}</div></div>
 <h2>Products</h2>${P.map(p=>`<div class=row><img src="${p.img}"><div><b>${esc(p.name)}</b><br><span class=mu>${esc(p.cat)}</span></div><input id="pr${p.id}" type=number step=.01 value="${p.price}"><input id="qt${p.id}" type=number value="${p.qty}"><button data-a=upd data-id="${p.id}">Save</button><button class=x data-a=delp data-id="${p.id}">Delete</button></div>`).join('')}`}

const img=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
const v=id=>$('#'+id).value.trim();
async function setStatus(o,s){
 try{await runTransaction(db,async t=>{const ps=[];
  if(s=='approved')for(const i of o.items){const r=doc(db,'products',i.id),d=await t.get(r);if(!d.exists())continue;if(d.data().qty<i.qty)throw Error('Not enough stock for '+i.name);ps.push([r,d.data().qty-i.qty])}
  ps.forEach(([r,q])=>t.update(r,{qty:q}));t.update(doc(db,'orders',o.id),{status:s})})}catch(e){alert(e.message)}}
const act={
 cat:id=>{cat=id;render()},
 add:id=>{const p=P.find(x=>x.id==id);cart[id]=Math.min((cart[id]||0)+1,p.qty);save();render()},
 inc:id=>act.add(id),dec:id=>{cart[id]=(cart[id]||1)-1;if(cart[id]<1)delete cart[id];save();render()},
 rm:id=>{delete cart[id];save();render()},
 checkout:async b=>{const name=v('nmi'),phone=v('phi'),address=v('adi');if(!name||!phone||!address)return alert('Please enter your name, phone number and delivery address.');b.disabled=true;
  const items=cartItems().map(x=>({id:x.p.id,name:x.p.name,price:x.p.price,qty:x.q}));
  try{const o={name,phone,address,items,total:total(),status:'pending',createdAt:Date.now()},r=await addDoc(collection(db,'orders'),o);
   ids.push(r.id);info={name,phone,address};cart={};save();keep();watch(r.id);location.hash='/order/'+r.id;setTimeout(()=>location.href=waUrl({...o,id:r.id}),400)}catch(e){alert('Could not place order: '+e.message);b.disabled=false}},
 wa:()=>location.href=waUrl(OV),
 login:()=>signInWithEmailAndPassword(auth,v('em'),$('#pw').value).catch(e=>alert('Login failed: '+e.code)),
 logout:()=>signOut(auth),
 approve:id=>setStatus(O.find(o=>o.id==id),'approved'),reject:id=>setStatus(O.find(o=>o.id==id),'rejected'),
 addc:async()=>{const n=v('cn');if(n)await addDoc(collection(db,'categories'),{name:n})},
 delc:id=>confirm('Delete this category? Products keep their label.')&&deleteDoc(doc(db,'categories',id)),
 addp:async b=>{const f=$('#pi').files[0];if(!v('pn')||v('pp')===''||v('pq')===''||!f||!v('pc'))return alert('Fill every field, choose a category and a picture.');
  b.disabled=true;await addDoc(collection(db,'products'),{name:v('pn'),cat:v('pc'),price:+v('pp'),qty:+v('pq'),img:await img(f),createdAt:Date.now()})},
 upd:id=>updateDoc(doc(db,'products',id),{price:+v('pr'+id),qty:+v('qt'+id)}).then(()=>alert('Saved')),
 delp:id=>confirm('Delete this product?')&&deleteDoc(doc(db,'products',id))};
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b.dataset.id||b,b)};
</script></body></html>
