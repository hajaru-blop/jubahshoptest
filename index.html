<!DOCTYPE html>

<title>Zabeda Apparel</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.01em}body.op,body.mop{overflow:hidden}
a{color:var(--fg)}.mu{color:var(--mu);font-size:13px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin:32px 0 14px}

button:hover:not(:disabled){opacity:.88}

.logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.badge{font-size:inherit;font-weight:inherit}
main{max-width:1280px;margin:0 auto;padding:0 24px 64px;min-height:65vh}

.gal{display:flex;flex-direction:column-reverse;gap:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.thumbs::-webkit-scrollbar{display:none}

.zoom-box{position:relative;overflow:hidden;background:var(--sf);aspect-ratio:3/4;cursor:zoom-in}

#ov,#mov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}

#dr{position:fixed;top:0;right:0;bottom:0;height:100dvh;width:min(420px,100vw);background:#fff;z-index:50;transform:translateX(100%);transition:transform .32s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}body.op #dr{transform:none}

.rcpt{display:inline-block;padding:3px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;border:1px solid var(--fg);color:var(--fg);background:var(--sf);margin-left:6px}
.st-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ethumbs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}

.ethumb img{width:100%;height:100%;object-fit:cover;display:block}
.ethumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;min-height:0;padding:0;font-size:12px;background:rgba(0,0,0,.78);color:#fff;border:0}
#ft{border-top:1px solid var(--bd);margin-top:40px;background:var(--sf)}.fi{max-width:1280px;margin:0 auto;padding:28px 24px 36px}.soc{display:flex;flex-wrap:wrap;margin-left:-10px}
.auth{max-width:380px;margin:0 auto;padding-top:16px}.btn{display:block;text-align:center;background:var(--fg);color:#fff;padding:13px;text-decoration:none;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.btn.alt{background:#fff;color:var(--fg);border:1px solid var(--fg)}
.lk{background:none;color:var(--fg);border:0;padding:0 4px;min-height:40px;text-decoration:underline;text-transform:none;letter-spacing:0;font-size:13px}[hidden]{display:none!important}#acc{position:relative}.dot{position:absolute;top:12px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
@media(min-width:768px){
  .grid{grid-template-columns:repeat(3,1fr);gap:40px 20px}

  .pdp{grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
  .gal{flex-direction:row;align-items:start}
  .thumbs{flex-direction:column;width:76px;max-height:620px;overflow-y:auto}
  .thumbs img{width:76px;height:100px}
  .zoom-box{flex:1}
}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){
  header{padding:0 8px 0 14px}
  .logo{font-size:16px;letter-spacing:.07em}
  nav{gap:0}
  .ib,button.ib{padding:0 6px;font-size:11px;letter-spacing:.06em;min-width:34px}

}
@media print{
  .promo,header,#ft,.no-print{display:none!important}
  body{background:#fff}
  .receipt-card{border:1px solid #000;background:#fff}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const receiptMailto=(o)=>{const link=location.origin+location.pathname+'#/order/'+o.id;
 const sub=`Official Receipt — ${SHOP} (Order #${o.id.slice(0,8).toUpperCase()})`;
 const body=`Hi ${o.name},\n\nThank you for shopping with ${SHOP}! Your payment has been received and your order is now being prepared.\n\nOFFICIAL RECEIPT\nOrder ID: #${o.id.slice(0,8).toUpperCase()}\nDate: ${new Date(o.receiptIssuedAt||Date.now()).toLocaleDateString()}\n\nItems:\n`+o.items.map(i=>`- ${i.name} x${i.qty} (${m(i.price*i.qty)})`).join('\n')+`\n\nTotal Paid: ${m(o.total)}\n\nView or print your official receipt anytime here:\n${link}\n\nWarm regards,\n${SHOP}`;
 return`mailto:${encodeURIComponent(o.receiptEmail)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`};

async function sendAutoReceiptEmail(o){
 if(!o.receipt||!o.receiptEmail)return false;
 if(EJS_PUBLIC_KEY&&EJS_SERVICE_ID&&EJS_TEMPLATE_ID){
  const link=location.origin+location.pathname+'#/order/'+o.id;
  const itemsText=o.items.map(i=>`${i.name} x${i.qty} - ${m(i.price*i.qty)}`).join('\n');
  try{
   const res=await fetch('https://api.emailjs.com/api/v1.0/email/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
     service_id:EJS_SERVICE_ID,template_id:EJS_TEMPLATE_ID,user_id:EJS_PUBLIC_KEY,
     template_params:{
      to_email:o.receiptEmail,to_name:o.name,shop_name:SHOP,
      order_id:o.id.slice(0,8).toUpperCase(),
      order_date:new Date(o.receiptIssuedAt||Date.now()).toLocaleDateString(),
      items:itemsText,total:m(o.total),receipt_link:link,address:o.address
     }
    })
   });
   return res.ok;
  }catch{return false}
 }
 return false;
}

async function setStatus(o,s){
 if(!o)return;
 const wasDeducted=['preparing','approved','shipped','delivered'].includes(o.status);
 const willDeduct=['preparing','approved','shipped','delivered'].includes(s);
 const issuingReceipt=!wasDeducted&&willDeduct&&o.receipt;
 const upd={status:s,...(issuingReceipt?{receiptIssuedAt:Date.now()}:{})};
 try{await runTransaction(db,async t=>{const ps=[];
  if(!wasDeducted&&willDeduct)for(const i of o.items){const r=doc(db,'products',i.id),d=await t.get(r);if(!d.exists())continue;if(d.data().qty<i.qty)throw Error('Not enough stock for '+i.name);ps.push([r,d.data().qty-i.qty])}
  ps.forEach(([r,q])=>t.update(r,{qty:q}));t.update(doc(db,'orders',o.id),upd)});
  if(issuingReceipt){
   const sent=await sendAutoReceiptEmail({...o,...upd});
   if(sent){await updateDoc(doc(db,'orders',o.id),{receiptSent:true});toast('Order confirmed & receipt emailed to '+o.receiptEmail)}
   else{toast('Order confirmed & digital receipt issued');if(o.receiptEmail&&!EJS_PUBLIC_KEY)location.href=receiptMailto({...o,...upd})}
  }else{toast('Order updated to '+s)}
 }catch(e){alert(e.message)}}

const act={
 cart:()=>{renderCart();document.body.classList.add('op')},close:()=>document.body.classList.remove('op'),
 cat:id=>{cat=id;render()},
 view:id=>{location.hash='/product/'+id},
 pic:i=>{selImg=+i;render()},
 pdec:()=>{if(pdpQty>1){pdpQty--;render()}},
 pinc:max=>{if(pdpQty<+max){pdpQty++;render()}},
 add:id=>{const p=P.find(x=>x.id==id);if((cart[id]||0)>=p.qty)return toast('Maximum stock reached');cart[id]=(cart[id]||0)+1;save();renderCart();toast('Added to cart: '+p.name)},
 addpdp:id=>{const p=P.find(x=>x.id==id);if((cart[id]||0)+pdpQty>p.qty)return toast('Not enough stock available');cart[id]=(cart[id]||0)+pdpQty;save();renderCart();toast(`Added ${pdpQty} × ${p.name} to cart`)},
 inc:id=>{const p=P.find(x=>x.id==id);if((cart[id]||0)<p.qty){cart[id]++;save();renderCart()}},
 dec:id=>{cart[id]=(cart[id]||1)-1;if(cart[id]<1)delete cart[id];save();renderCart()},
 rm:id=>{delete cart[id];save();renderCart()},
 checkout:async b=>{const name=v('nmi'),phone=v('phi'),address=v('adi'),over18=user?true:!!$('#agec')?.checked,receipt=!!$('#rcptc')?.checked,receiptEmail=receipt?(v('emi')||user?.email||''):'';
  if(!name||!phone||!address)return alert('Please enter your name, phone number and delivery address.');
  if(!over18)return alert('Please confirm that you are 18 or older before placing an order.');
  if(receipt&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(receiptEmail))return alert('Please enter a valid email address to receive your receipt.');
  b.disabled=true;
  const items=cartItems().map(x=>({id:x.p.id,name:x.p.name,price:x.p.price,qty:x.q}));
  try{const o={name,phone,address,over18:true,receipt,...(receipt?{receiptEmail}:{}),...(user?{uid:user.uid}:{}),items,total:total(),status:'pending',createdAt:Date.now()},r=await addDoc(collection(db,'orders'),o);
   ids.push(r.id);info={name,phone,address,over18,receipt,...(receiptEmail?{email:receiptEmail}:{})};cart={};save();keep();watch(r.id);act.close();location.hash='/order/'+r.id;setTimeout(()=>location.href=waUrl({...o,id:r.id}),400)}catch(e){alert('Could not place order: '+e.message);b.disabled=false}},
 wa:()=>location.href=waUrl(OV),
 login:async()=>{if(mode=='up'&&!$('#reg18')?.checked)return alert('Please confirm that you are 18 or older to create an account.');
  try{const c=await(mode=='in'?signInWithEmailAndPassword:createUserWithEmailAndPassword)(auth,v('em'),$('#pw').value);location.hash=sel(c.user.email)?'/admin':'/'}catch(e){alert(ae(e))}},
 mode:()=>{mode=mode=='in'?'up':'in';render()},
 forgot:async()=>{const e=v('em');if(!e)return alert('Enter your email address first.');try{await sendPasswordResetEmail(auth,e);alert('Password reset email sent. Check your inbox.')}catch(x){alert(ae(x))}},
 logout:()=>signOut(auth),
 setst:(id,b)=>setStatus(O.find(o=>o.id==id),b.dataset.st),
 addc:async()=>{const n=v('cn');if(n)await addDoc(collection(db,'categories'),{name:n})},
 delc:id=>confirm('Delete this category? Products will keep their label.')&&deleteDoc(doc(db,'categories',id)),
 addp:async b=>{const files=[...$('#pi').files];if(!v('pn')||v('pp')===''||v('pq')===''||!files.length||!v('pc'))return alert('Fill in the name, category, price, quantity, and choose at least one image.');
  b.disabled=true;
  try{const encoded=await Promise.all(files.slice(0,5).map(img));
   await addDoc(collection(db,'products'),{name:v('pn'),cat:v('pc'),price:+v('pp'),qty:+v('pq'),desc:v('pd'),img:encoded[0],imgs:encoded,createdAt:Date.now()});
   toast('Product published');
  }catch(e){alert('Upload failed (try fewer or smaller photos): '+e.message);b.disabled=false}},
 edit:id=>{const p=P.find(x=>x.id==id);if(!p)return;editId=id;editImgs=[...imgs(p)];renderModal();document.body.classList.add('mop')},
 closem:()=>{editId=null;document.body.classList.remove('mop')},
 rmimg:i=>{if(editImgs.length<=1)return alert('A product must have at least 1 photo.');editImgs.splice(+i,1);renderModal()},
 saveedit:async b=>{if(!editId)return;const name=v('epn'),cat=v('epc'),price=v('epp'),qty=v('epq'),desc=v('epd');
  if(!name||price===''||qty==='')return alert('Name, price, and stock are required.');
  b.disabled=true;
  try{await updateDoc(doc(db,'products',editId),{name,cat,price:+price,qty:+qty,desc,img:editImgs[0]||'',imgs:editImgs});
   act.closem();toast('Product updated');
  }catch(e){alert('Could not save: '+e.message);b.disabled=false}},
 delp:id=>confirm('Delete this product?')&&deleteDoc(doc(db,'products',id))};

document.onclick=e=>{
 const b=e.target.closest('[data-a]');
 if(b){e.stopPropagation();act[b.dataset.a](b.dataset.id||b,b)}
};
document.onchange=async e=>{
 const t=e.target;
 if(t.id=='epi'&&t.files.length){
  const extra=await Promise.all([...t.files].slice(0,5-editImgs.length).map(img));
  editImgs=[...editImgs,...extra];
  renderModal();
 }else if(t.id=='agec'){
  info.over18=t.checked;keep();
 }else if(t.id=='rcptc'){
  info.receipt=t.checked;keep();renderCart();
 }
};
document.oninput=e=>{const t=e.target;
 if(t.id=='q'){S=t.value;$('#gr').innerHTML=grid()}
 else if(t.id=='nmi'||t.id=='phi'||t.id=='adi'||t.id=='emi'){info[{nmi:'name',phi:'phone',adi:'address',emi:'email'}[t.id]]=t.value;keep()}};

/* Interactive magnifying zoom on product detail image */
document.addEventListener('mousemove',e=>{
 const box=e.target.closest?.('#zbox');
 if(!box)return;
 const im=$('#zimg'),r=box.getBoundingClientRect();
 const x=((e.clientX-r.left)/r.width)*100,y=((e.clientY-r.top)/r.height)*100;
 box.classList.add('zoomed');
 im.style.transformOrigin=`${x}% ${y}%`;
 im.style.transform='scale(2)';
});
document.addEventListener('mouseout',e=>{
 const box=e.target.closest?.('#zbox');
 if(box&&!box.contains(e.relatedTarget)){
  box.classList.remove('zoomed');
  const im=$('#zimg');if(im){im.style.transform='';im.style.transformOrigin='center center'}
 }
});

addEventListener('keydown',e=>{if(e.key=='Escape'){act.close();act.closem()}});
dispatchEvent(new Event('hashchange'));
</script></body></html>
